name: Deploy Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-lab
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/checkout@v7
        with:
          repository: zzaaid03/Brewit
          path: .brewit-src

      - name: Check Brewit engine is in sync
        run: pnpm sync:brewit:check
        env:
          BREWIT_REPO_PATH: .brewit-src

      - run: pnpm test

      - run: pnpm build

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Pin VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "167.233.39.1 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHZ39wen3sSx21pbiG4osJW9NiF2oafXo1dNd37cGWZW" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: 'rsync -av --delete apps/lab/dist/ ibrahim@167.233.39.1:'
